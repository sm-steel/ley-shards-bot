[project]
name = "ley-shards-bot"
version = "0.1.0"
description = "Private Telegram gacha game bot — Ley Shards economy, character pulls, pity/banners."
readme = "README.md"
authors = [
    { name = "smsteel", email = "omg.smsteel@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27",
    "pymysql>=1.1",
    "python-dotenv>=1.0",
    "python-telegram-bot[job-queue]>=21.0",
    "sqlalchemy>=2.0",
]

[project.scripts]
ley-shards-bot = "ley_shards_bot:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
