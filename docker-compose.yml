services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      mariadb:
        condition: service_healthy
    # heartbeat.py touches /tmp/ley-shards-bot-heartbeat after every real,
    # successful getUpdates cycle -- a stale file means polling is wedged
    # even though the process itself is still running. Same pattern as
    # nani-pix-bot's own compose file (see priv-vps-infrastructure#86) --
    # this is the reference copy the Ansible role's template is built from.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test $(( $(date +%s) - $(stat -c %Y /tmp/ley-shards-bot-heartbeat 2>/dev/null || echo 0) )) -lt 90",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Fleet-wide autoheal (tmknight/docker-autoheal, see the ops vault's
    # инфраструктура/Autoheal.md) restarts any container Docker itself
    # marks unhealthy -- but only containers carrying these labels, since
    # monitoring is opt-in fleet-wide.
    labels:
      autoheal.monitor.enable: "true"
      autoheal.restart.enable: "true"

volumes:
  mariadb_data:
