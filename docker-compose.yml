services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      mariadb:
        condition: service_healthy
    # heartbeat.py touches /tmp/ley-shards-bot-heartbeat after every real,
    # successful getUpdates cycle -- a stale file means polling is wedged
    # even though the process itself is still running.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test $(( $(date +%s) - $(stat -c %Y /tmp/ley-shards-bot-heartbeat 2>/dev/null || echo 0) )) -lt 90",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Optional: if you run github.com/tmknight/docker-autoheal (or a
    # similar watcher) it restarts any container Docker marks unhealthy,
    # but only containers carrying these labels. Harmless/ignored if you
    # don't run one.
    labels:
      autoheal.monitor.enable: "true"
      autoheal.restart.enable: "true"

volumes:
  mariadb_data:
