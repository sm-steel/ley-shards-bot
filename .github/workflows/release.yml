name: Release

# Fires after checks.yml/tests.yml would already have run on the same
# push (both trigger on push to master too) -- semantic-release itself
# doesn't gate on their success, so this assumes master is only ever
# updated through a merge that already passed CI, same assumption this
# repo's deploy step has always made (this repo's own deploy.yml,
# before it was retired in favor of priv-vps-infrastructure's Ansible
# role).
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Semantic Version Release
        id: release
        uses: python-semantic-release/python-semantic-release@9a026e9303981c866c3425723009becb2437c757 # v10.6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"
          build: false
          changelog: true
          # commit: false is deliberate, not a bug -- master requires PRs,
          # and GITHUB_TOKEN can't push a branch update around that. Tags
          # live in a different ref namespace (refs/tags/*, not
          # refs/heads/master) so push+tag alone never touches the
          # protected branch. pyproject.toml IS still stamped with the
          # release version on disk (version_toml, Task 2) -- that change
          # is just never committed. Verified safe against this exact
          # repo's uv.lock shape (nani-pix-bot#3's investigation): the
          # root package is `source = { editable = "." }`, so a stamped-
          # but-uncommitted version never breaks the Dockerfile's
          # `uv sync --frozen` below.
          commit: false
          push: true
          tag: true
          vcs_release: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.release.outputs.released == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.release.outputs.released == 'true'
        with:
          context: .
          push: true
          tags: ghcr.io/sm-steel/ley-shards-bot:${{ steps.release.outputs.version }}
